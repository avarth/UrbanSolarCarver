[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbansolarcarver"
version = "0.11.0"
description = "GPU-accelerated generation of maximum buildable volumes that respect solar access, daylight, and thermal comfort constraints in urban environments."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
keywords = ["solar-envelope", "urban-design", "daylight", "GPU", "voxel", "computational-design"]
authors = [
  { name = "Aristotelis Vartholomaios", email = "avartholomaios@uth.gr" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
dependencies = [
  "typer>=0.16.0",
  "pydantic>=2.0",
  "PyYAML>=6.0.2",
  "numpy>=1.24.3",
  "matplotlib>=3.10",
  "scipy>=1.10",
  "numba>=0.58",
  "scikit-image>=0.24",
  "Shapely>=2.1.1",
  "ezdxf>=1.4",  # DXF outlines and faces, with their elevations (outlines.py)
  "trimesh>=4.6.12",
  "rtree>=1.0",
  "ladybug-core>=0.44.19",
  "ladybug-radiance>=0.2.11",
  "warp-lang>=1.7.2",
  "torch>=2.0",  # CPU wheel is fine; setup_env.py installs the correct CUDA variant first
]

[project.urls]
Homepage = "https://github.com/avarth/UrbanSolarCarver"
Documentation = "https://avarth.github.io/UrbanSolarCarver/"
Repository = "https://github.com/avarth/UrbanSolarCarver"
Issues = "https://github.com/avarth/UrbanSolarCarver/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-xdist>=3.5", "mapbox-earcut", "httpx>=0.27", "import-linter>=2.1", "pydeps>=3.0", "ruff>=0.15"]
# Local browser UI (usc ui)
ui = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "websockets>=12", "send2trash>=1.8"]
# Rebuild the Grasshopper .ghuser files (grasshopper/build_ghuser.py)
ghbuild = ["pythonnet>=3.0"]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
  "mkdocs-literate-nav>=0.6",
]

[project.scripts]
urbansolarcarver = "urbansolarcarver.carver_cli:app"
usc = "urbansolarcarver.carver_cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["urbansolarcarver*"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
urbansolarcarver = ["ui_static/**/*", "example_projects/**/*"]

[tool.pytest.ini_options]
# A misspelt marker is an error (see docs/testing.md). With -n, a worker that runs out
# of tests takes some from another's queue (worksteal), so the long tests given out together do not leave one worker running alone.
addopts = "--strict-markers --dist worksteal"
testpaths = ["tests"]
markers = [
  "slow: takes seconds (end-to-end scenes, simulations, a daemon process); skip with -m 'not slow'",
  "sweep: exhaustive parameter sweeps and Monte Carlo seeds, also marked slow, run before merging; skip with -m 'not sweep'",
  "gpu: needs a CUDA GPU; skipped automatically when torch sees none (see tests/conftest.py)",
]

# Ruff finds mistakes, not style: it does not format, and tests/test_architecture.py runs it. The rules: pyflakes (unused imports and
# variables, undefined names), syntax errors, mutable defaults, a comparison whose result is thrown away, and pylint's errors.
[tool.ruff]
extend-exclude = ["benchmarks", "examples", "app", "docs", "src/urbansolarcarver/ui_static", "src/urbansolarcarver/example_projects"]

[tool.ruff.lint]
select = ["F", "E9", "B006", "B015", "PLE"]

[tool.ruff.lint.per-file-ignores]
"grasshopper/components/*" = ["F821"]    # a component's inputs are globals Grasshopper defines
"tools/grasshopper_example_solve_in_rhino.py" = ["F821"]    # SETTINGS comes from the launcher

# Import rules (import-linter): how the package is layered, checked by tests/test_architecture.py and by `lint-imports`.
# docs/project-map.md explains the layers. A new module must be placed in a layer (exhaustive).
[tool.importlinter]
root_package = "urbansolarcarver"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: front ends, service, requests, API, stages, engine, settings"
type = "layers"
containers = ["urbansolarcarver"]
exhaustive = true
layers = [
  "carver_cli | daemon",
  "local_web_service",
  "engine_requests",
  "api",
  "api_core | solar_check | access_evaluation | sites",
  "carving : scoring : context_geometry : voxelization : floor_plates : meshing : surface_sampling : sun : sky_patches : simulated_weights : ray_tracing : warp_kernels : io : column_postprocessing : cold_period : session : check_files",
  "outlines",
  "chain_config : load_config : check_settings : stage_settings : pydantic_schemas : mode_registry : run_context : errors : compute_device : weather_file : archetype_defaults : grid_planning : daemon_client",
]

[[tool.importlinter.contracts]]
name = "Settings modules load without torch, Warp or the web server"
type = "forbidden"
source_modules = [
  "urbansolarcarver.chain_config",
  "urbansolarcarver.load_config",
  "urbansolarcarver.check_settings",
  "urbansolarcarver.stage_settings",
  "urbansolarcarver.pydantic_schemas",
  "urbansolarcarver.mode_registry",
  "urbansolarcarver.run_context",
  "urbansolarcarver.errors",
]
forbidden_modules = ["torch", "warp", "fastapi", "uvicorn"]
