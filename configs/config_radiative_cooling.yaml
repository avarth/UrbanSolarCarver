# UrbanSolarCarver: Radiative cooling mode [EXPERIMENTAL]
# Carves voxels based on long-wave radiative cooling potential of the night sky.
# Uses Martin-Berdahl (1984) emissivity and Bliss (1961) angular attenuation.
# Assumes clear sky, horizontal analysis surfaces (flat roofs).
# Typical use: urban heat island mitigation, passive cooling envelope design.
#
# WARNING: This mode is experimental. The physics model assumes clear-sky
# conditions and a single dew-point value. Results should be validated.

# --- Required paths ---
max_volume_path:    "path/to/maxVolume.ply"
test_surface_path:  "path/to/testSurfaces.ply"
out_dir:            "path/to/output"

mode: radiative_cooling

# Radiative cooling parameters. The model uses a single representative
# night-time dew point; it does not read weather data or an analysis period.
dew_point_celsius: 14.0   # night-time dew-point (C)
bliss_k:            1.8   # angular attenuation constant (Bliss 1961); physical constant, leave at 1.8

# Grid
voxel_size: 1.0

# How much to carve: fraction (0-1) of the building's obstruction score to
# remove. 0.7 = aggressive (slimmer volume, more sky); 0.3 = conservative.
# Columns are then limited to a 75 degree slope against their neighbours
# (max_slope_deg), which turns cliffs and spires into ramps.
carve_fraction: 0.35
# Cooling scores are diffuse (every voxel above a surface obstructs some sky),
# so a given carve_fraction removes far more volume than in the solar modes.
# Start around 0.3-0.4 and inspect; 0.7 is usually far too aggressive here.

# --- Design constraints (declared, not physics; see docs) -------------------
# edge_taper: 1.5             # metres: sample points within this distance of a
#                             # test-surface edge count proportionally less, so
#                             # perimeter/corner points don't force carving of
#                             # the directly adjacent volume.
# min_sky_elevation_deg: 30   # protection cone: only defend sky above this
#                             # elevation (weights renormalized). Controls how
#                             # steeply the envelope may rise around surfaces.

# --- Defaults you may want to override --------------------------------------
# grid_step:       1.0    # test-surface sampling spacing in metres
# ray_length:      300.0  # max ray distance in metres
# apply_smoothing: false  # true = SDF smooth + marching cubes
# device:          'auto' # 'auto', 'cpu', or 'cuda'
# See REFERENCE_all_options.yaml for the complete parameter list.
