# UrbanSolarCarver: Daylight mode
# Carves voxels based on the CIE Standard Overcast Sky luminance distribution.
# The overcast sky is brightest at the zenith, so high patches weigh more.
# No EPW data or analysis period: the CIE overcast sky is purely geometric
# and time-invariant.
# Typical use: daylight access envelopes, overcast-sky design.

# --- Required paths ---
max_volume_path:    "path/to/maxVolume.ply"
test_surface_path:  "path/to/testSurfaces.ply"
out_dir:            "path/to/output"

mode: daylight

# Grid
voxel_size: 1.0

# How much to carve: share of the sky's weight (0-1) to protect. The rays from
# every test point to the centres of the highest-weight sky patches holding
# this share are kept clear. Small values already carve a lot; start at 0.1.
protect_share: 0.1

# --- Defaults you may want to override --------------------------------------
# voxel_size:      1.0    # voxel edge in metres (0.5 = 8x more voxels)
# grid_step:       1.0    # test-surface sampling spacing in metres
# ray_length:      300.0  # max ray distance in metres
# apply_smoothing: false  # true = SDF smooth + marching cubes
# device:          'auto' # 'auto', 'cpu', or 'cuda'
# See REFERENCE_all_options.yaml for the complete parameter list.
