# UrbanSolarCarver: Irradiance mode
# Carves voxels based on cumulative solar irradiance (direct + diffuse)
# reaching test surfaces via each sky patch. Uses Perez all-weather sky model.
# Typical use: maximise total solar energy on facades/rooftops.

# --- Required paths ---
max_volume_path:    "path/to/maxVolume.ply"
test_surface_path:  "path/to/testSurfaces.ply"
epw_path:           "path/to/weather.epw"  # bundled sample: examples/weather/USA_CO_Golden-NREL.724666_TMY3.epw
out_dir:            "path/to/output"

mode: irradiance

# Analysis period (ladybug AnalysisPeriod.to_dict() can be pasted here)
analysis_period:
  st_month:  1
  st_day:    1
  st_hour:   0
  end_month: 12
  end_day:   31
  end_hour:  23

# Grid
voxel_size: 1.0

# Thresholding: keep the highest-weight sky patches holding protect_share of
# the total weight fully visible from every test point (whole rays are
# cleared, so the envelope is continuous). 0.1 already carves a lot.
threshold: protect_share
protect_share: 0.1

# --- Defaults you may want to override --------------------------------------
# score_smoothing: null  # Gaussian blur radius (m) on scores before thresholding. null = auto (1.1× voxel_size). 0 = off. Try 1.0-1.2× voxel_size.
# voxel_size:      1.0    # voxel edge in metres (0.5 = 8x more voxels)
# grid_step:       1.0    # test-surface sampling spacing in metres
# ray_length:      300.0  # max ray distance in metres
# Alternative: carve the voxels holding a fraction of the obstruction score.
# With carve_above it can leave cliffs and spires (each column is decided by
# its highest-scoring voxel).
# threshold:       carve_fraction
# carve_fraction:  0.7    # fraction of the obstruction score to remove (0-1)
# apply_smoothing: false  # true = SDF smooth + marching cubes
# device:          'auto' # 'auto', 'cpu', or 'cuda'
# See REFERENCE_all_options.yaml for the complete parameter list.
