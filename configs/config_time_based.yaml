# UrbanSolarCarver: Time-based mode
# Classic solar envelope: carves voxels that cast shadows on test surfaces
# during the specified hours. Each voxel's score is the shading it causes
# (m²·h); by default any shadow at all removes the voxel.
# Typical use: solar access guarantees for a specific date and time window.

# --- Required paths ---
max_volume_path:    "path/to/maxVolume.ply"
test_surface_path:  "path/to/testSurfaces.ply"
epw_path:           "path/to/weather.epw"  # bundled sample: examples/weather/USA_CO_Golden-NREL.724666_TMY3.epw
out_dir:            "path/to/output"

mode: time-based

# Analysis period: usually a single day or narrow window
# Example: winter solstice, 10 AM to 2 PM
# (ladybug AnalysisPeriod.to_dict() can be pasted here)
analysis_period:
  st_month:  12
  st_day:    21
  st_hour:   10
  end_month: 12
  end_day:   21
  end_hour:  14

# Grid
voxel_size: 1.0

# --- Threshold ---
# time-based scores measure the shading a voxel causes on the test surfaces:
# shaded area x duration over the analysis period, in m²·h. Use a
# non-negative number:
#   threshold: 0   strict: keep only voxels that never shadow test surfaces (default)
#   threshold: 5   tolerate up to 5 m²·h (e.g. 5 m² of facade for one hour)
# String methods (headtail/carve_fraction) do not apply and raise an error.
# sun_steps_per_hour: 12   # sun sampled every 5 min (default); hourly leaves gaps
# threshold: 0    # uncomment to set explicitly; None uses the strict default (0)

# --- Defaults you may want to override --------------------------------------
# voxel_size:      1.0    # voxel edge in metres (0.5 = 8x more voxels)
# grid_step:       1.0    # test-surface sampling spacing in metres
# ray_length:      300.0  # max ray distance in metres
# threshold:       None   # tolerated shading in m²·h: 0 = strict (default), 5 = up to 5 m²·h
# min_altitude:    5.0    # ignore sun below this elevation (degrees)
# apply_smoothing: false  # true = SDF smooth + marching cubes
# device:          'auto' # 'auto', 'cpu', or 'cuda'
# See REFERENCE_all_options.yaml for the complete parameter list.
