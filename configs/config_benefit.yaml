# UrbanSolarCarver: Benefit mode
# Carves voxels based on passive solar heating benefit: sky-patch irradiance
# of the hours when the outdoor temperature is below balance_temperature -
# balance_offset.
# Typical use: heating-season envelope for cold/temperate climates.

# --- Required paths ---
max_volume_path:    "path/to/maxVolume.ply"
test_surface_path:  "path/to/testSurfaces.ply"
epw_path:           "path/to/weather.epw"  # bundled sample: examples/weather/USA_CO_Golden-NREL.724666_TMY3.epw
out_dir:            "path/to/output"

mode: benefit

# Analysis period (ladybug AnalysisPeriod.to_dict() can be pasted here).
# A FULL-YEAR period is safe and natural for benefit mode: the balance
# filter selects the beneficial (cold) hours by itself. A heating-season
# window like the one below merely reduces compute time.
analysis_period:
  st_month:  10
  st_day:    15
  st_hour:   7
  end_month: 4
  end_day:   15
  end_hour:  19

# Benefit parameters
balance_temperature: 15.0   # °C, free-running balance point (Ladybug default;
                            # typ. ~12 commercial to ~18 residential, higher for
                            # older poorly insulated stock). Derive project-specific
                            # values with the Honeybee/E+ balance-point workflow.
balance_offset:       2.0   # °C, dead-band below the balance point (>= 0)
# simulated_weights_path: simulated_weights.json
#                           # SIMULATED weights: replaces the simple balance-
#                           # point rule above with hourly weights from a
#                           # building simulation (ISO 13790 5R1C: thermal
#                           # lag, mass state). Generate with `usc simulate-weights
#                           # -e weather.epw -a configs/archetype_example.yaml`.
#                           # balance_* are then unused.
# include_harm: false       # EXPERIMENTAL. true = Ladybug's composite concept:
#                           # hot-hour (T > balance + offset) radiation is
#                           # subtracted per sky patch, clipped at zero. Results
#                           # then depend on how much warm season the analysis
#                           # period includes. Default false = cold-hour benefit
#                           # only (period-stable, recommended).

# Grid (adjust voxel_size for resolution vs speed)
voxel_size: 1.0

# How much to carve: fraction (0-1) of the building's obstruction score to
# remove. 0.7 = aggressive (slimmer volume, more sky); 0.3 = conservative.
# Columns are then limited to a 75 degree slope against their neighbours
# (max_slope_deg), which turns cliffs and spires into ramps.
carve_fraction: 0.7

# --- Defaults you may want to override --------------------------------------
# voxel_size:      1.0    # voxel edge in metres (0.5 = 8x more voxels)
# grid_step:       1.0    # test-surface sampling spacing in metres
# ray_length:      300.0  # max ray distance in metres
# apply_smoothing: false  # true = SDF smooth + marching cubes
# device:          'auto' # 'auto', 'cpu', or 'cuda'
# See REFERENCE_all_options.yaml for the complete parameter list.
